# nginx site config for CaltechTHESIS behind Granian. Install as
# /etc/nginx/sites-available/caltechthesis.conf (cloud-init.yaml's setup script
# writes an equivalent with a self-signed cert for bring-up instances).
#
# The UI app is Granian on 127.0.0.1:5000 and the REST app is Granian on
# 127.0.0.1:5001, both plain HTTP, so this uses proxy_pass. uWSGI's uwsgi_pass
# and uwsgi_param directives no longer apply.

# Legacy URL redirects. This file only defines the $redirect_uri map, so it has
# to be included at http level, outside any server block. Absolute path because
# the map lives in the repo checkout rather than under /etc/nginx.
include /Sites/caltechthesis/redirect-map.conf;

# nginx's mime.types (Ubuntu) has no entry for .mjs, so pdf.js's ES modules
# under /static/js/pdfjs would be served as application/octet-stream and
# browsers refuse to load them as modules. Placed at http level on purpose:
# repeated types blocks in one context add to the map, while a types block in a
# server or location context REPLACES the inherited one and would turn every
# other extension under /static into octet-stream. After any change here, curl
# a .mjs and a control .css -- see verify_rdm_boot.bash. (caltechauthors
# found and fixed this on 2026-09-10.)
types {
    text/javascript mjs;
}

server {
  server_name thesis.caltechlibrary.dev;
  listen 80;
  listen [::]:80;
  return 301 https://$host$request_uri;
}

server {
  server_name thesis.caltechlibrary.dev;
  # Replace with the Certbot-managed lines (ssl_certificate and
  # ssl_certificate_key under /etc/letsencrypt/live/<host>/) in production.
  include snippets/self-signed.conf;
  include snippets/ssl-params.conf;
  listen 443 ssl;
  listen [::]:443 ssl;

  add_header Strict-Transport-Security "max-age=15768000"; # 6 months
  # Request ID tracing (allows end-to-end tracking of requests for better
  # troubleshooting)
  add_header X-Request-ID $request_id;
  # The application owns X-Frame-Options and the other security headers
  # (Talisman, APP_DEFAULT_SECURE_HEADERS in invenio.cfg). Do not add_header
  # them here: nginx appends rather than replaces, and two conflicting
  # X-Frame-Options values make browsers refuse to frame the response, which
  # broke the file preview on caltechauthors (DR-0005 there).

  # The request body is sent to the proxied server immediately as it is
  # received
  proxy_request_buffering off;
  proxy_buffering off;
  # Sets the HTTP protocol v1.1 for proxying in order to not use the buffer
  # in case of chunked transfer encoding
  proxy_http_version 1.1;

  ## UI server
  location / {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Pass request id to the ui server
    proxy_set_header X-Request-ID $request_id;
    # X-Session-ID / X-User-ID is read by nginx and included in the logs,
    # however we don't want to expose them to clients so we are hiding them.
    proxy_hide_header X-Session-ID;
    proxy_hide_header X-User-ID;
    # Max upload size (except for files) is set to 100mb as default.
    client_max_body_size 100m;
  }

  # Matched pair with rdm_rest.service, adopted from caltechauthors DR-0007.
  # Granian's --url-path-prefix /api sets SCRIPT_NAME=/api and strips the prefix
  # from PATH_INFO, so the REST app knows where it is mounted and the redirects
  # and url_for() paths it generates keep "/api". nginx therefore forwards the
  # full, unmodified URI: proxy_pass has NO trailing slash here, and the
  # file-content location below has no capture-group rewrite. Change one half
  # of the pair without the other and every /api request breaks. (A trailing
  # slash on proxy_pass was caltechauthors' first attempt; it left SCRIPT_NAME
  # empty and 404'd /administration/banners.)
  ## Most API
  location /api {
    proxy_pass http://127.0.0.1:5001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Pass request id to the api server
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Session-ID;
    proxy_hide_header X-User-ID;
    # Max upload size (except for files) is set to 100mb as default.
    client_max_body_size 100m;
  }

  ## API files
  # Another location is defined in order to allow large file uploads in the files
  # API without exposing the other parts of the application to receive huge
  # request bodies. This includes part content uploads of multipart file uploads,
  # which carry a numeric part suffix.
  location ~ ^/api/records/.+/draft/files/.+/content(?:/[0-9]+)?/?$ {
    gzip off;
    proxy_pass http://127.0.0.1:5001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Session-ID;
    proxy_hide_header X-User-ID;
    # Max upload size for files is set to 500GB (configure as needed).
    client_max_body_size 500G;
  }

  # Static content is served directly by nginx and not the application server.
  # The path reflects uv's venv layout.
  location /static {
    alias /Sites/caltechthesis/.venv/var/instance/static;
    autoindex off;
    # nginx serves these itself, so the application never sees them and
    # Talisman never gets to set a header on them. A location-level add_header
    # REPLACES every inherited one rather than adding to it, so the two
    # server-level headers have to be restated here or they are silently lost
    # for /static.
    add_header Strict-Transport-Security "max-age=15768000";
    add_header X-Request-ID $request_id;
    add_header X-Content-Type-Options nosniff;
  }

  # Redirect old urls from redirect-map. Server level, so it is evaluated before
  # a location is chosen. The map yields an empty string for any URI it doesn't
  # know and an empty value is falsy, so this is a no-op for every other URL.
  if ($redirect_uri) {
    return 301 $redirect_uri;
  }
}
