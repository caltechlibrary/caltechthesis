# Legacy URL redirects, included at http level by nginx-dev.conf and
# nginx-production.conf. Deliberately empty for now: when CaltechTHESIS moves
# from EPrints to RDM, each old EPrints path gets an entry here mapping it to
# the new RDM record path, e.g.
#
#     /12345/    /records/abcde-12345;
#
# The map yields "" (falsy) for every URI it doesn't list, so an empty map
# changes nothing.
map_hash_max_size 26214;
map_hash_bucket_size 26214;
map $request_uri $redirect_uri {
    default "";
}
